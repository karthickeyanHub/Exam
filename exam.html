<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="exam-header">
    <div class="header-top">
      <a class="back-link" href="index.html">&larr; Exams</a>
      <h1 id="examTitle" class="exam-title"></h1>
      <div class="header-stats">
        <span class="top-stat correct">Correct: <strong id="statCorrect">0</strong></span>
        <span class="top-stat wrong">Wrong: <strong id="statWrong">0</strong></span>
      </div>
      <div class="header-right">
        <button id="submitBtn" class="btn btn-primary btn-sm" type="button">Submit Exam</button>
        <div id="timer" class="timer">00:00</div>
      </div>
    </div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <p id="progressText" class="progress-text"></p>
  </header>

  <main id="questionArea" class="question-area">
    <div class="exam-layout">
      <div class="question-card">
        <p id="reviewBanner" class="review-banner hidden">
          Review mode: correct answers are highlighted in green, your incorrect selections in red.
        </p>
        <div class="badge-row">
          <div id="requiredBadge" class="required-badge hidden"></div>
          <button id="revealBtn" class="btn btn-info btn-sm" type="button">Reveal Answer</button>
          <button id="markBtn" class="btn btn-mark btn-sm" type="button">Mark for Review</button>
        </div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="optionsList" class="options-list"></div>
        <p id="feedback" class="feedback"></p>
        <div class="controls bottom-controls">
          <button id="bottomPrevBtn" class="btn btn-secondary" type="button">Previous</button>
          <button id="bottomNextBtn" class="btn btn-secondary" type="button">Next</button>
        </div>
      </div>
      <aside id="sidePanel" class="side-panel" aria-label="Exam sidebar">
        <div class="controls">
          <button id="prevBtn" class="btn btn-secondary" type="button">Previous</button>
          <button id="nextBtn" class="btn btn-secondary" type="button">Next</button>
          <button id="scoreBackBtn" class="btn btn-secondary hidden" type="button">Back to Score</button>
        </div>
        <div class="nav-card">
          <div class="nav-title">Questions</div>
          <div id="navGrid" class="nav-grid"></div>
        </div>
      </aside>
    </div>
  </main>

  <section id="scoreArea" class="score-area hidden"></section>

  <script src="fallback-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
